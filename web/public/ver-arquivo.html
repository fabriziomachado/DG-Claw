<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arquivo - S2 Bot</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/tema.css">
<script src="/tema.js"></script>
<!-- Leitura de um arquivo da Pasta do agente (25/10/2026): o MESMO estilo e o MESMO formatador da conversa,
     para o arquivo abrir na Pasta igual abre no chat. A aba Pasta do painel abre esta tela por cima dela. -->
<link rel="stylesheet" href="/dgui.css">
<link rel="stylesheet" href="/conversa.css">
<style>
  body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:var(--dg-fundo)}
  /* tela cheia com a mesma barra do visor do chat (27/10/2026): fechar, voltar, abrir em outra aba, baixar */
  #lightbox{position:static;height:100%}
  #raiz .lb-texto{flex:1}
  .va-vis{flex:1;width:100%;border:0;background:var(--dg-fundo)}
  .va-aviso{margin:24px auto;max-width:560px;padding:0 16px;color:var(--dg-texto-2);font-size:14.5px;line-height:1.5}
  .lnk-pasta{cursor:pointer}
  .dg-car-img,.dgui-imagem img{cursor:zoom-in}
</style>
</head>
<body>
<div id="lightbox" class="abre">
  <div class="lbtopo">
    <button id="lbFechar" aria-label="Fechar" title="Fechar (Esc)" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button id="vaVoltar" aria-label="Voltar" title="Voltar para a página anterior" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <span class="lbnome" id="lbNome"></span>
    <a id="lbAbrir" href="#" target="_blank" rel="noopener" aria-label="Abrir em outra aba" title="Abrir em outra aba" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg></a>
    <a id="lbBaixar" href="#" download aria-label="Baixar" title="Baixar" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg></a>
  </div>
  <main class="lbcorpo" id="raiz"><p class="va-aviso">Abrindo…</p></main>
</div>
<script src="/vendor/highlight-11.9.0.min.js"></script>
<script src="/dgui.js"></script>
<script src="/formatador.js"></script>
<script src="/mermaid-desenho.js"></script>
<script src="/ver-arquivo.js"></script>
</body>
</html>
